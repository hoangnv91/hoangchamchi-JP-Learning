version: '3.8'

services:
  frontend-next:
    build:
      context: ./hoangchamchi.org-main/frontend-next
      dockerfile: Dockerfile.preview.vibeflow
    environment:
      REACT_APP_HOST_IP: 'express-db'
      GA_MEASUREMENT_ID: ''
    networks:
      - hoangchamchi-network

  express-db:
    build:
      context: ./hoangchamchi.org-main/backend/express
      dockerfile: Dockerfile.preview.vibeflow
    environment:
      REACT_APP_HOST_IP: 'express-db'
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    networks:
      - hoangchamchi-network

  flask-dynamic-db:
    build:
      context: ./hoangchamchi.org-main/backend/flask
      dockerfile: Dockerfile.preview.vibeflow
    networks:
      - hoangchamchi-network

  dictionary-db:
    build:
      context: ./hoangchamchi.org-main/backend/dictionary
      dockerfile: Dockerfile.preview.vibeflow
    environment:
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    volumes:
      - ./hoangchamchi.org-main/config_dummy.json:/app/config.json
    networks:
      - hoangchamchi-network

  nginx:
    image: nginx:latest
    ports:
      - '5173:80'
    volumes:
      - ./nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-next
      - express-db
      - flask-dynamic-db
      - dictionary-db
    networks:
      - hoangchamchi-network

networks:
  hoangchamchi-network: